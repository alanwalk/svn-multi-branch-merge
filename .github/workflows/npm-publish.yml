name: Node.js Package

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install SVN test dependencies
        run: sudo apt-get update && sudo apt-get install -y subversion
      - run: npm ci
      - name: Check release version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const { version } = JSON.parse(fs.readFileSync("package.json", "utf8")); if (process.env.RELEASE_TAG !== `v${version}`) throw new Error("Release tag must match v" + version);'
      - run: npm run build
      - run: npm test
      - run: npm pack --dry-run

  publish-npm:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - run: npm install --global npm@11
      - run: npm ci
      - name: Publish to npm
        env:
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if [ "$PRERELEASE" = "true" ]; then
            npm publish --access public --tag next
          else
            npm publish --access public --tag latest
          fi
